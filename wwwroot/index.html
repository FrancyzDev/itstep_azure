<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Manager</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #1a73e8; text-align: center; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1557b0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #1a73e8; color: white; }
        .delete-btn { background: #dc3545; padding: 6px 12px; font-size: 12px; }
        .delete-btn:hover { background: #c82333; }
        .error { color: red; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Items Manager</h1>
        
        <div class="card">
            <h2>➕ Додати новий товар</h2>
            <div class="form-group">
                <label>Назва</label>
                <input type="text" id="name" placeholder="Введіть назву товару">
            </div>
            <div class="form-group">
                <label>Ціна (грн)</label>
                <input type="number" id="price" placeholder="0">
            </div>
            <button onclick="createItem()">➕ Додати</button>
            <div id="formMessage"></div>
        </div>

        <div class="card">
            <h2>📋 Список товарів</h2>
            <table id="itemsTable">
                <thead>
                    <tr><th>ID</th><th>Назва</th><th>Опис</th><th>Ціна</th></tr>
                </thead>
                <tbody id="itemsList"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api/items';

        async function loadItems() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Помилка завантаження');
                const items = await response.json();
                const tbody = document.getElementById('itemsList');
                tbody.innerHTML = items.map(item => `
                    <tr>
                        <td>${item.id}</td>
                        <td>${escapeHtml(item.name)}</td>
                        <td>${item.price} ₴</td>
                        <td><button class="delete-btn" onclick="deleteItem(${item.id})">🗑 Видалити</button></td>
                    </tr>
                `).join('');
            } catch (error) {
                showMessage('Помилка завантаження списку', 'error');
            }
        }

        async function createItem() {
            const name = document.getElementById('name').value.trim();
            const price = parseFloat(document.getElementById('price').value);

            if (!name) {
                showMessage('Введіть назву товару', 'error');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, price })
                });

                if (!response.ok) throw new Error('Помилка створення');
                
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                showMessage('Товар успішно додано!', 'success');
                loadItems();
            } catch (error) {
                showMessage('Помилка створення товару', 'error');
            }
        }

        async function deleteItem(id) {
            if (!confirm('Видалити цей товар?')) return;
            
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Помилка видалення');
                showMessage('Товар видалено!', 'success');
                loadItems();
            } catch (error) {
                showMessage('Помилка видалення', 'error');
            }
        }

        function showMessage(msg, type) {
            const div = document.getElementById('formMessage');
            div.textContent = msg;
            div.className = type;
            setTimeout(() => div.textContent = '', 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        loadItems();
    </script>
</body>
</html>
